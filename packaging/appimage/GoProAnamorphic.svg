      <stop offset="0" stop-color="#2b3a55"/>
      <stop offset="1" stop-color="#11161f"/>
    </linearGradient>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3bc9ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7fe3ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#3bc9ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="48" fill="url(#bg)"/>
  <!-- Cornice widescreen anamorfica 2.39:1 -->
  <rect x="34" y="96" width="188" height="79" rx="8" fill="none" stroke="#e7eef7" stroke-width="7"/>
  <!-- Lente -->
