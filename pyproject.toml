[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gopro-anamorphic-toolkit"
version = "0.2.0"
description = "Gyroflow stabilization + 1.2x anamorphic desqueeze + full-resolution H.265 export for GoPro HERO11 Black + Neewer LS-56"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "John Bianchi" }]
keywords = ["gopro", "anamorphic", "gyroflow", "ffmpeg", "video", "neewer"]
classifiers = [
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
# The core CLI has no mandatory Python dependency: it only needs ffmpeg/ffprobe
# and (for stabilization) Gyroflow as external executables.
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest>=7"]

[project.scripts]
gat = "gat.cli:main"
gat-gui = "gat.gui:main"

[project.urls]
Homepage = "https://github.com/bianchi-john/GoProNeewer1.2xAnamorphic"
Repository = "https://github.com/bianchi-john/GoProNeewer1.2xAnamorphic"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gat = ["resources/*.json", "resources/previews/*", "resources/ui/*.svg"]
